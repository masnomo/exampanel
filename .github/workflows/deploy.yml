name: 🚀 FAST DEPLOY (ZIP Mode)
on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Zip and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📦 Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 🏗️ Build Assets (Vite)
        run: |
          npm install
          npm run build

      - name: 🤐 Create Deployment Artifact (ZIP)
        run: |
          zip -r deploy.zip . -x "*.git*" "node_modules/*" "tests/*" "storage/logs/*"

      - name: 📂 Upload ZIP and Extractor
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /
          exclude: |
            **/*
            !deploy.zip
            !public/extract.php

      - name: ⚡ Trigger Extraction
        run: |
          curl -s "https://panelexam.mas-azzahra.sch.id/extract.php?token=deploy_token_99122"
          echo "Extraction complete!"

      - name: 🧹 Auto Clear Cache
        run: |
          curl -s "https://panelexam.mas-azzahra.sch.id/migrate-database"
          echo "Database migrated!"
